    --cocoa:#4a3b31;
    --rose:#b98479;
    --rose-soft:#f0dcd3;
    --gold:#8f7449;
    --muted:#6c5b50;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#8a7565 0%,#7a675a 50%,#5f4f44 100%);
    color:var(--cocoa);
    font-family:"Cormorant",Georgia,serif;
    min-height:100vh;
    overflow-x:hidden;
  }


  html{scroll-behavior:smooth}
  main{position:relative;z-index:1}

  /* Blurred copy of the picture fills the sides on wide screens */
  .backdrop{position:fixed;inset:-40px;z-index:0;background:var(--bg-img) center / cover no-repeat;filter:blur(26px) brightness(.5) saturate(.9)}

  /* First screen is exactly one viewport tall and holds only the invitation */
  .hero{position:relative;height:100vh;height:100svh;display:flex;justify-content:center;overflow:hidden}
  .cue{position:absolute;left:0;right:0;bottom:10px;width:max-content;margin:0 auto;z-index:4;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#fff7ee;font-family:"Montserrat",sans-serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 1px 6px rgba(40,25,15,.8);opacity:0;animation:fadein 1s ease 4s forwards}
  .cue svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
  @keyframes fadein{to{opacity:1}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* Petals drift down the outer sides only, never over the invitation */
  .petals{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .petal{
    position:absolute;top:-30px;width:12px;height:16px;
    background:var(--rose-soft);border-radius:100% 0 100% 0;opacity:.85;
    animation:fall linear infinite;
  }
  @keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}

  /* Invitation image. All text is real HTML placed on the empty panel. */
  .invite{
    position:relative;flex:none;
    container-type:inline-size;
    height:100vh;height:100svh;
    width:calc(100vh * 724 / 1280);width:calc(100svh * 724 / 1280);
    overflow:hidden;background:#8b7a6c;
    box-shadow:0 0 60px rgba(20,12,6,.55);
    animation:reveal 1.6s ease both;
  }
  @keyframes reveal{from{opacity:0}to{opacity:1}}

  /* Slow cinematic drift on the picture */
  .bg{
    position:absolute;inset:0;
    background:var(--bg-img) center / 100% 100% no-repeat;
    transform-origin:50% 28%;
    animation:drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.06)}}

  /* Soft light that glides across the scene */
  .glow{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(115deg,transparent 35%,rgba(255,245,225,.55) 50%,transparent 65%);
    background-size:250% 100%;
    animation:sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{0%{background-position:130% 0}60%,100%{background-position:-130% 0}}

  .panel{
    position:absolute;
    left:15%;right:15%;top:36%;height:49%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .fade{opacity:0;transform:translateY(10px);animation:rise 1.1s ease forwards}
  .d1{animation-delay:.5s}.d2{animation-delay:1s}.d3{animation-delay:1.5s}
  .d4{animation-delay:2s}.d5{animation-delay:2.5s}.d6{animation-delay:3s}
  @keyframes rise{to{opacity:1;transform:none}}

  .eyebrow{font-family:"Montserrat",sans-serif;letter-spacing:.32em;font-size:2.1cqw;text-transform:uppercase;color:var(--gold)}
  .lead{font-style:italic;font-size:4.5cqw;line-height:1.45;margin-top:2.6cqw;color:var(--cocoa)}
  .greeting{font-style:italic;color:var(--muted);font-size:4cqw;margin-top:2cqw;min-height:1.3em}

  .names{
    font-family:"Great Vibes",cursive;font-weight:400;
    font-size:8.8cqw;line-height:1.3;margin-top:2cqw;white-space:nowrap;
    padding:0 .18em .08em;
    background:linear-gradient(100deg,#4a3b31 0%,#4a3b31 38%,#b98479 50%,#4a3b31 62%,#4a3b31 100%);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:rise 1.1s ease 1.5s forwards, shine 6s ease-in-out 3.5s infinite;
  }
  .names .amp{padding:0 1.2cqw}
  @keyframes shine{0%{background-position:100% 0}50%,100%{background-position:0 0}}

  .date{margin-top:3cqw}
  .date .day{font-family:"Montserrat",sans-serif;letter-spacing:.3em;font-size:2.3cqw;text-transform:uppercase;color:var(--muted)}
  .date .big{font-weight:500;font-size:6.2cqw;line-height:1.15;margin-top:.6cqw}

  .meta{display:flex;justify-content:center;gap:9cqw;margin-top:4cqw}
  .meta div{display:flex;flex-direction:column;align-items:center;gap:1.2cqw;max-width:30cqw}
  .meta svg{width:6.4cqw;height:6.4cqw;color:var(--gold)}
  .meta .pin{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8cqw)}}
  .togo{font-style:italic;font-size:4.2cqw;color:var(--gold);margin-top:4.2cqw;letter-spacing:.04em;min-height:1.3em}
  .meta span{font-weight:500;font-size:3.7cqw;line-height:1.25;color:var(--cocoa)}

  /* Below the image */
  .below{padding:30px 18px 46px;text-align:center;background:rgba(66,51,42,.88)}
  .count{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .count div{min-width:64px}
  .count b{display:block;font-weight:500;font-size:2rem;color:#f3e4dc}
  .count span{font-family:"Montserrat",sans-serif;font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;color:#d8c8bb}
  .actions{display:flex;flex-direction:column;gap:11px;align-items:center;margin-top:26px}
  .btn{
    display:inline-block;width:100%;max-width:300px;
    font-family:"Montserrat",sans-serif;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
    text-decoration:none;padding:14px 16px;border-radius:2px;cursor:pointer;
    border:1px solid #e4c9bf;color:#f3e4dc;background:transparent;transition:.25s;
  }
  .btn:hover{background:#e4c9bf;color:#4a3b31}
  .btn.solid{background:#e4c9bf;color:#4a3b31}
  .btn.solid:hover{background:#f3e4dc;border-color:#f3e4dc}
  footer{text-align:center;margin-top:24px;font-family:"Montserrat",sans-serif;font-size:.6rem;letter-spacing:.22em;color:#cdbdb0;text-transform:uppercase}

  @media (prefers-reduced-motion:reduce){
    .cue{animation:none;opacity:1}
    .cue svg{animation:none}
    .petals{display:none}
    .fade{opacity:1;transform:none;animation:none}
    .bg,.glow,.names,.meta .pin,.invite{animation:none}
    .names{background:none;-webkit-text-fill-color:var(--cocoa);color:var(--cocoa)}
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<main>
  <div class="hero">
  <section class="invite" aria-label="Engagement invitation">
    <div class="bg" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <div class="panel">
      <p class="eyebrow fade d1">Together with our families</p>
      <p class="greeting fade d1" id="greeting"></p>
      <p class="lead fade d2">invite you to celebrate<br>our engagement</p>
      <h1 class="names fade d3">Mohanad <span class="amp">&</span> Shahd</h1>

      <div class="date fade d4">
        <div class="day">Friday</div>
        <div class="big">16 October 2026</div>
      </div>

      <div class="meta fade d5">
        <div>
          <svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="venueName"></span>
        </div>
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span id="timeText"></span>
        </div>
      </div>

      <p class="togo fade d6" id="togo"></p>
    </div>
  </section>
  <a class="cue" href="#below" aria-label="Scroll down for details">Scroll<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </div>

  <section class="below" id="below">
    <div class="count fade d6" aria-live="off">
      <div><b id="cd">0</b><span>Days</span></div>
      <div><b id="ch">0</b><span>Hours</span></div>
      <div><b id="cm">0</b><span>Minutes</span></div>
      <div><b id="cs">0</b><span>Seconds</span></div>
    </div>

    <div class="actions fade d6">
      <a class="btn solid" id="mapBtn" target="_blank" rel="noopener">Get Directions</a>
      <a class="btn" id="calBtn" href="#">Add to Calendar</a>
      <a class="btn" id="rsvpBtn" target="_blank" rel="noopener">RSVP on WhatsApp</a>
    </div>
    <footer>16 . 10 . 2026</footer>
  </section>
</main>

<script>
/* =========================================================
   EDIT ONLY THIS BLOCK
   ========================================================= */
const CONFIG = {
  groom: "Mohanad",
  bride: "Shahd",
  year: 2026, month: 10, day: 16,
  hour: 19, minute: 0,                          // 7:00 PM (change me)
  timeLabel: "7:00 PM",                         // text shown on the page
  venueName: "Our Home",
  venueAddress: "Street name, Area, City",       // used in the calendar file (change me)
  mapsUrl: "https://maps.google.com/?q=YOUR+ADDRESS+HERE", // change me
  whatsapp: "201211469675"                       // country code, no + or spaces (change me)
};
/* ========================================================= */

const eventDate = new Date(CONFIG.year, CONFIG.month - 1, CONFIG.day, CONFIG.hour, CONFIG.minute);

document.getElementById("timeText").textContent = CONFIG.timeLabel;
document.getElementById("venueName").textContent = CONFIG.venueName;
document.getElementById("mapBtn").href = CONFIG.mapsUrl;

/* Personal greeting: ?name=Ahmed -> "Dear Ahmed," */
const guest = new URLSearchParams(location.search).get("name");
if (guest) {
  document.getElementById("greeting").textContent = "Dear " + guest.slice(0, 40) + ",";
  document.title = "For " + guest.slice(0, 40) + " | Mohanad & Shahd";
}

const rsvpText = encodeURIComponent(
  "Hello " + CONFIG.groom + "! " + (guest ? "This is " + guest + ". " : "") +
  "I received your invitation and I would love to attend on 16 October."
);
document.getElementById("rsvpBtn").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + rsvpText;

/* Countdown (decorative only) */
const pad = n => String(n).padStart(2, "0");
function tick(){
  let diff = Math.max(0, eventDate - new Date());
  const d = Math.floor(diff / 864e5); diff -= d * 864e5;
  const h = Math.floor(diff / 36e5);  diff -= h * 36e5;
  const m = Math.floor(diff / 6e4);   diff -= m * 6e4;
  const s = Math.floor(diff / 1e3);
  document.getElementById("cd").textContent = d;
  document.getElementById("ch").textContent = pad(h);
  document.getElementById("cm").textContent = pad(m);
  document.getElementById("cs").textContent = pad(s);
}
tick(); setInterval(tick, 1000);

/* "X days to go" line inside the invitation */
(function(){
  const el = document.getElementById("togo");
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(eventDate.getFullYear(), eventDate.getMonth(), eventDate.getDate());
  const n = Math.round((b - a) / 864e5);
  el.textContent = n > 1 ? n + " days to go" : n === 1 ? "Tomorrow is the day" : n === 0 ? "Today is the day" : "Thank you for celebrating with us";
})();

/* Add to calendar (.ics built in the browser) */
document.getElementById("calBtn").addEventListener("click", function(e){
  e.preventDefault();
  const f = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
  const end = new Date(eventDate.getTime() + 4 * 36e5);
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invitation//EN","BEGIN:VEVENT",
    "UID:engagement-" + f(eventDate) + "@invite",
    "DTSTAMP:" + f(new Date()),
    "DTSTART:" + f(eventDate),
    "DTEND:" + f(end),
    "SUMMARY:Engagement of " + CONFIG.groom + " & " + CONFIG.bride,
    "LOCATION:" + CONFIG.venueName + ", " + CONFIG.venueAddress,
    "DESCRIPTION:We would love to celebrate with you.",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "engagement-invitation.ics";
  document.body.appendChild(a); a.click(); a.remove();
});


/* Petals on the outer sides only */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("petals");
  const card = document.querySelector(".invite");
  function build(){
    box.innerHTML = "";
    const r = card.getBoundingClientRect(), W = window.innerWidth;
    const zones = [[0, Math.max(r.left - 16, 14)], [Math.min(r.right + 16, W - 14), W]];
    for (let i = 0; i < 22; i++){
      const z = zones[i % 2], span = Math.max(z[1] - z[0] - 14, 0);
      const p = document.createElement("i");
      p.className = "petal";
      p.style.left = (z[0] + Math.random() * span) + "px";
      p.style.setProperty("--dx", (Math.random() * 50 - 25) + "px");
      p.style.animationDuration = (9 + Math.random() * 10) + "s";
      p.style.animationDelay = (-Math.random() * 18) + "s";
      box.appendChild(p);
    }
  }
  build();
  let t; addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(build, 200); });
})();
</script>
</body>
</html>
